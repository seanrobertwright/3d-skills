<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lril3d viewer</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #14171f; color: #e6e9ef;
                   font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
      #canvas { position: fixed; inset: 0; }
      #panel { position: fixed; top: 12px; left: 12px; padding: 12px 14px; border-radius: 8px;
               background: rgba(14, 17, 24, .82); border: 1px solid #2b3242; min-width: 250px; }
      #panel h1 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
      label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      input[type=range] { flex: 1; }
      #status { margin-top: 10px; padding-top: 8px; border-top: 1px solid #2b3242;
                color: #9aa4b8; white-space: pre-line; }
      .warn { color: #e8a33d; }
      .err { color: #e2604f; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="panel">
      <h1>lril3d viewer</h1>
      <label><input type="checkbox" id="wireframe" /> wireframe</label>
      <label><input type="checkbox" id="grid" checked /> build plate</label>
      <label>section Z <input type="range" id="section" min="0" max="1" step="0.005" value="1" /></label>
      <label><input type="checkbox" id="preview" disabled /> g-code preview</label>
      <label id="layer-row" hidden>layer <input type="range" id="layer" min="0" max="0" step="1" value="0" /><span id="layer-n">0</span></label>
      <div id="status">loading…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
